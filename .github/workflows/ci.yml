name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
      - name: CLI smoke test
        run: |
          pip install .
          fet --version
          fet --help
